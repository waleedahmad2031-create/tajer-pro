<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>تاجر برو | المتجر</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Tahoma,Arial,sans-serif;
background:#f5f5f5;
}

header{
background:#009688;
color:#fff;
padding:15px;
font-size:22px;
text-align:center;
font-weight:bold;
}

#products{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
gap:15px;
padding:15px;
}

.card{
background:#fff;
border-radius:10px;
overflow:hidden;
box-shadow:0 2px 8px rgba(0,0,0,.15);
}

.card img{
width:100%;
height:180px;
object-fit:cover;
}

.card h3{
padding:10px;
font-size:18px;
}

.card p{
padding:0 10px 10px;
color:#009688;
font-weight:bold;
}

</style>

</head>

<body>

<header>
🛒 تاجر برو
</header>

<div id="products">
جاري تحميل المنتجات...
</div>

<script type="module" src="app.js"></script>

</body>

</html>
