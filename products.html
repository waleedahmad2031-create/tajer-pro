<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>إضافة المنتجات - سوق مباشر</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="header">
📦 إضافة المنتجات
</div>


<div class="card">

<input id="name" placeholder="اسم المنتج">

<input id="price" type="number" placeholder="السعر">

<input id="image" placeholder="رابط صورة المنتج">

<textarea id="desc" placeholder="وصف المنتج"></textarea>


<button id="saveBtn" class="btn">
حفظ المنتج
</button>

</div>



<script type="module">

import { db } from "./firebase.js";

import {
collection,
addDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


document.getElementById("saveBtn").onclick = async()=>{


let name=document.getElementById("name").value;
let price=document.getElementById("price").value;
let image=document.getElementById("image").value;
let desc=document.getElementById("desc").value;


if(!name || !price || !image){

alert("اكمل البيانات");
return;

}


await addDoc(collection(db,"products"),{

name:name,
price:Number(price),
image:image,
desc:desc,
date:new Date()

});


alert("تم حفظ المنتج");


document.getElementById("name").value="";
document.getElementById("price").value="";
document.getElementById("image").value="";
document.getElementById("desc").value="";


};


</script>


</body>
</html>
