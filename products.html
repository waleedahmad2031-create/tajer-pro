<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المنتجات | تاجر برو</title>

<link rel="stylesheet" href="style.css">

<style>
input{
width:100%;
padding:12px;
margin:8px 0;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}

th,td{
border:1px solid #ddd;
padding:10px;
text-align:center;
}

th{
background:#0d6efd;
color:white;
}
</style>

</head>
<body>

<div class="header">
📦 إدارة المنتجات
</div>

<div class="card">

<input id="name" placeholder="اسم المنتج">

<input id="barcode" placeholder="الباركود">

<input id="buy" type="number" placeholder="سعر الشراء">

<input id="sell" type="number" placeholder="سعر البيع">

<input id="qty" type="number" placeholder="الكمية">

<button class="btn">
حفظ المنتج
</button>

</div>

<div class="card">

<h3>قائمة المنتجات</h3>

<table>

<tr>
<th>المنتج</th>
<th>الكمية</th>
<th>البيع</th>
</tr>

<tr>
<td>لا توجد منتجات</td>
<td>-</td>
<td>-</td>
</tr>

</table>

</div>

</body>
</html>
