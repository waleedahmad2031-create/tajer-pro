<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>لوحة الإدارة - سوق مباشر</title>

<link rel="stylesheet" href="style.css">

<style>

.list{
margin:15px;
}

.item{
background:#fff;
padding:10px;
margin-bottom:10px;
border-radius:10px;
box-shadow:0 2px 8px rgba(0,0,0,.1);
}

.item img{
width:100%;
height:180px;
object-fit:cover;
border-radius:10px;
}

.del{
background:#dc3545;
color:#fff;
border:none;
padding:10px;
width:100%;
border-radius:8px;
margin-top:10px;
cursor:pointer;
}

</style>

</head>

<body>

<div class="header">
📦 إدارة المنتجات
</div>

<div class="card">

<input id="name" placeholder="اسم المنتج">

<input id="price" type="number" placeholder="السعر">

<input id="image" placeholder="رابط الصورة">

<textarea id="desc" placeholder="وصف المنتج"></textarea>

<button id="saveBtn" class="btn">
💾 حفظ المنتج
</button>

</div>

<div id="products" class="list"></div>

<script type="module">

import { db } from "./firebase.js";

import {
collection,
addDoc,
getDocs,
deleteDoc,
doc
} from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";
async function loadProducts(){

const box=document.getElementById("products");

box.innerHTML="";

const snap=await getDocs(collection(db,"products"));

snap.forEach((d)=>{

const p=d.data();

box.innerHTML+=`

<div class="item">

<img src="${p.image}" alt="">

<h3>${p.name}</h3>

<p><b>${p.price} ريال</b></p>

<p>${p.desc}</p>

<button class="del" onclick="delProduct('${d.id}')">
🗑 حذف
</button>

</div>

`;

});

}


document.getElementById("saveBtn").onclick=async()=>{

const name=document.getElementById("name").value.trim();
const price=document.getElementById("price").value;
const image=document.getElementById("image").value.trim();
const desc=document.getElementById("desc").value.trim();

if(!name||!price||!image){

alert("أكمل البيانات");

return;

}

await addDoc(collection(db,"products"),{

name,
price:Number(price),
image,
desc,
date:Date.now()

});

alert("تم حفظ المنتج");

document.getElementById("name").value="";
document.getElementById("price").value="";
document.getElementById("image").value="";
document.getElementById("desc").value="";

loadProducts();

};


window.delProduct=async(id)=>{

if(!confirm("حذف المنتج؟")) return;

await deleteDoc(doc(db,"products",id));

loadProducts();

};

loadProducts();

</script>

</body>
</html
