<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>طلباتي | سوق مباشر</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Tahoma,Arial,sans-serif;
background:#f5f5f5;
}

header{
background:#00897b;
color:white;
text-align:center;
padding:15px;
font-size:22px;
font-weight:bold;
}

.container{
padding:15px;
}


.order{
background:white;
border-radius:10px;
padding:15px;
margin-bottom:15px;
box-shadow:0 2px 5px #ccc;
}


.order h3{
color:#00897b;
margin-bottom:10px;
}


.order p{
margin:6px 0;
}


.status{
display:inline-block;
padding:5px 10px;
border-radius:5px;
background:#eee;
margin-top:10px;
}


.empty{
background:white;
padding:30px;
text-align:center;
border-radius:10px;
font-size:18px;
}


button{
width:100%;
padding:12px;
border:none;
background:#00897b;
color:white;
border-radius:8px;
font-size:16px;
margin-top:15px;
}


</style>

</head>


<body>


<header>
📦 طلباتي
</header>


<div class="container">


<div id="ordersList"></div>


<button onclick="clearOrders()">
حذف الطلبات المحفوظة
</button>


</div>
<script>

let orders =
JSON.parse(localStorage.getItem("orders")) || [];


const ordersList =
document.getElementById("ordersList");



function showOrders(){


ordersList.innerHTML="";


if(orders.length === 0){


ordersList.innerHTML = `

<div class="empty">
لا توجد طلبات حالياً 📦
</div>

`;

return;

}



orders.forEach((order,index)=>{


ordersList.innerHTML += `

<div class="order">

<h3>
طلب رقم ${index + 1}
</h3>


<p>
📅 التاريخ:
${order.date || "غير محدد"}
</p>


<p>
📦 المنتجات:
${order.items || ""}
</p>


<p>
💰 الإجمالي:
${order.total || 0} ريال
</p>


<p class="status">
الحالة:
${order.status || "قيد المراجعة"}
</p>


</div>

`;


});


}



function clearOrders(){


if(confirm("هل تريد حذف جميع الطلبات؟")){


localStorage.removeItem("orders");

orders=[];

showOrders();


}


}



showOrders();


</script>


</body>

</html>
