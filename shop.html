<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>سوق مباشر</title>

<link rel="stylesheet" href="style.css">

<style>

.products{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;
padding:15px;
}

.product{
background:white;
border-radius:10px;
padding:15px;
box-shadow:0 0 8px #ddd;
text-align:center;
}

.product img{
width:100%;
height:150px;
object-fit:cover;
border-radius:8px;
}

.price{
color:green;
font-size:18px;
font-weight:bold;
}

.btn{
display:block;
background:#198754;
color:white;
padding:10px;
margin-top:10px;
border-radius:8px;
text-decoration:none;
}

</style>

</head>

<body>

<div class="header">
🛒 سوق مباشر
</div>

<div class="card">

<h2>المنتجات</h2>

<div class="products">

<div class="product">

<img src="https://via.placeholder.com/200">

<h3>اسم المنتج</h3>

<p class="price">
0 ريال
</p>

<p>
وصف المنتج
</p>

<a class="btn" href="#">
🛒 أضف للسلة
</a>

</div>


</div>

</div>

</body>
</html>
