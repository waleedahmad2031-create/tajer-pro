<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>السلة | سوق مباشر</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Tahoma,Arial,sans-serif;
background:#f5f5f5;
color:#222;
}

header{
background:#00897b;
color:white;
padding:15px;
text-align:center;
font-size:22px;
font-weight:bold;
}

.container{
padding:15px;
}

.cart-item{
background:white;
border-radius:10px;
padding:12px;
margin-bottom:12px;
box-shadow:0 2px 5px #ccc;
display:flex;
gap:10px;
align-items:center;
}

.cart-item img{
width:80px;
height:80px;
object-fit:cover;
border-radius:8px;
}

.info{
flex:1;
}

.info h3{
font-size:17px;
margin-bottom:8px;
}

.info p{
margin:4px 0;
color:#555;
}

.qty{
display:flex;
align-items:center;
gap:8px;
margin-top:8px;
}

.qty button{
width:30px;
height:30px;
border:none;
background:#00897b;
color:white;
border-radius:5px;
font-size:18px;
}

.delete{
background:#d32f2f !important;
}

.total-box{
background:white;
padding:15px;
border-radius:10px;
margin-top:15px;
font-size:18px;
font-weight:bold;
}

button.main{
width:100%;
padding:14px;
margin-top:15px;
background:#25D366;
color:white;
border:none;
border-radius:10px;
font-size:18px;
}

.empty{
text-align:center;
background:white;
padding:30px;
border-radius:10px;
font-size:18px;
}

a{
text-decoration:none;
}

</style>

</head>

<body>

<header>
🛒 سلة المشتريات
</header>

<div class="container">

<div id="cartList"></div>

<div id="totalBox" class="total-box"></div>

<button class="main" onclick="sendOrder()">
إرسال الطلب عبر واتساب
</button>

</div>
<script>

let cart = JSON.parse(localStorage.getItem("cart")) || [];

const cartList = document.getElementById("cartList");
const totalBox = document.getElementById("totalBox");


function showCart(){

cartList.innerHTML="";

if(cart.length === 0){

cartList.innerHTML = `
<div class="empty">
السلة فارغة 🛒
</div>
`;

totalBox.innerHTML="الإجمالي: 0 ريال";

return;

}


let total = 0;


cart.forEach((item,index)=>{


let price = Number(item.price) || 0;

let qty = Number(item.qty) || 1;

total += price * qty;


cartList.innerHTML += `

<div class="cart-item">


<img src="${item.image || 'https://via.placeholder.com/80'}">


<div class="info">

<h3>${item.name}</h3>

<p>السعر: ${price} ريال</p>


<div class="qty">

<button onclick="changeQty(${index},-1)">
-
</button>


<span>${qty}</span>


<button onclick="changeQty(${index},1)">
+
</button>


<button class="delete" onclick="removeItem(${index})">
🗑
</button>


</div>


</div>


</div>

`;

});


totalBox.innerHTML =
"الإجمالي: " + total + " ريال";


}



function changeQty(index,value){

cart[index].qty = Number(cart[index].qty || 1) + value;


if(cart[index].qty < 1){

cart[index].qty = 1;

}


saveCart();

}



function removeItem(index){

cart.splice(index,1);

saveCart();

}



function saveCart(){

localStorage.setItem(
"cart",
JSON.stringify(cart)
);

showCart();

}


showCart();


</script>
<script>

function sendOrder(){

if(cart.length === 0){

alert("السلة فارغة");

return;

}


let message = "طلب جديد من سوق مباشر:%0A%0A";


let total = 0;


cart.forEach((item)=>{

let price = Number(item.price) || 0;

let qty = Number(item.qty) || 1;

let sum = price * qty;

total += sum;


message +=
"📦 المنتج: " + item.name +
"%0A" +
"🔢 الكمية: " + qty +
"%0A" +
"💰 السعر: " + sum + " ريال" +
"%0A%0A";

});


message +=
"💵 الإجمالي: " + total + " ريال";


let phone = "966550496391";


window.location.href =
"https://wa.me/" + phone +
"?text=" + message;


}



</script>


</body>

</html>
